<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultCode — Cyberpunk Vault-Cracking Protocol</title>
    <base href="/" />

    <!-- Google Fonts: Inter & DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <!-- Font Awesome 6.5 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind CSS CDN with Custom Font Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            obsidian: '#080205',
                            crimson: '#ef4444',
                            ruby: '#b91c1c',
                            amber: '#f59e0b',
                            emerald: '#10b981'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        display: ['"DM Sans"', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Base Stylesheet -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="VaultCode.styles.css" rel="stylesheet" />
</head>

<body class="bg-black text-slate-100 font-sans antialiased selection:bg-rose-600 selection:text-white">
    <div id="app">
        <div class="app-loader">
            <div class="spinner-ring">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="text-xs uppercase tracking-widest text-rose-400 mt-5 font-mono-cyber loading-status-text"></div>
            <div class="loading-progress-bar">
                <div class="loading-progress-fill"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Security Breach Interrupted: An unhandled anomaly occurred.
        <a href="" class="reload font-semibold text-cyan-400">Reboot Node</a>
        <a class="dismiss">✕</a>
    </div>

    <!-- Synthetic Cyber Audio FX Engine -->
    <script src="js/cyber-audio.js"></script>

    <!-- Blazor WASM Script -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
